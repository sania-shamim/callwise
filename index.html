<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Callwise</title>
<meta name="theme-color" content="#0b1020">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b1020;--panel:#141b30;--line:#26335a;--text:#e9edf8;--muted:#8a95b5;--accent:#5b8cff;--mint:#7cf0d4}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:"Plus Jakarta Sans",system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);display:flex;justify-content:center;
background-image:radial-gradient(55% 38% at 85% 0%,rgba(91,140,255,.28),transparent 70%),radial-gradient(45% 32% at 0% 100%,rgba(124,240,212,.14),transparent 70%),radial-gradient(rgba(255,255,255,.05) 1px,transparent 1px);
background-size:auto,auto,22px 22px}
.app{width:100%;max-width:720px;height:100dvh;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 16px calc(env(safe-area-inset-bottom) + 12px)}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 4px 14px}
h1{font-size:1.3rem;font-weight:700;letter-spacing:-.02em}
.tag{font-size:.82rem;color:var(--muted);margin-top:2px}
#spk{font:inherit;font-size:.8rem;font-weight:500;color:var(--muted);background:transparent;border:1px solid var(--line);border-radius:999px;padding:7px 14px;cursor:pointer}
#spk[aria-pressed="true"]{color:var(--mint);border-color:rgba(124,240,212,.4)}
#log{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:12px;padding:8px 2px 16px;scroll-behavior:smooth}
#empty{margin:auto;text-align:center;color:var(--muted);max-width:260px;line-height:1.6}
#empty b{display:block;color:var(--text);font-size:1.15rem;font-weight:600;margin-bottom:6px}
.msg{max-width:84%;padding:11px 15px;border-radius:18px;line-height:1.55;font-size:.97rem;white-space:pre-wrap;overflow-wrap:anywhere}
.you{align-self:flex-end;background:var(--accent);color:#fff;border-bottom-right-radius:6px}
.bot{align-self:flex-start;background:var(--panel);border:1px solid var(--line);border-bottom-left-radius:6px}
.err{color:#ffb4b4;border-color:#5a2a35}
.typing{display:flex;gap:5px;padding:15px 16px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:b 1.1s infinite ease-in-out}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes b{0%,80%,100%{opacity:.3;transform:translateY(0)}40%{opacity:1;transform:translateY(-4px)}}
.bar{display:flex;align-items:center;gap:10px}
.field{flex:1;display:flex;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:5px 5px 5px 18px}
.field:focus-within{border-color:var(--accent)}
#txt{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--text);font:inherit;font-size:1rem;padding:9px 0}
#txt::placeholder{color:var(--muted)}
button{font:inherit;cursor:pointer;border:0}
#send{width:40px;height:40px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center}
#mic{width:54px;height:54px;border-radius:50%;background:linear-gradient(135deg,var(--accent),#7a5bff);color:#fff;display:grid;place-items:center;flex:none;position:relative}
#mic.live::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid var(--mint);animation:p 1.2s infinite ease-out}
@keyframes p{from{transform:scale(1);opacity:.9}to{transform:scale(1.6);opacity:0}}
svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
button:focus-visible{outline:2px solid var(--mint);outline-offset:3px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<main class="app">
  <header>
    <div><h1>Callwise</h1><p class="tag">Call. Ask. Know.</p></div>
    <button id="spk" aria-pressed="true">Voice replies: on</button>
  </header>
  <div id="log" aria-live="polite">
    <div id="empty"><b>Ask anything</b>Tap the mic to speak, or type your question below.</div>
  </div>
  <div class="bar">
    <div class="field">
      <input id="txt" placeholder="Type your question" autocomplete="off" aria-label="Your question">
      <button id="send" aria-label="Send"><svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
    </div>
    <button id="mic" aria-label="Tap to speak"><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
  </div>
</main>
<script>
const log=document.getElementById("log"),txt=document.getElementById("txt"),mic=document.getElementById("mic"),spk=document.getElementById("spk"),empty=document.getElementById("empty");
let speak=true,busy=false,rec=null;

function add(who,t){
  empty.hidden=true;
  const d=document.createElement("div");
  d.className="msg "+who;d.textContent=t;
  log.appendChild(d);log.scrollTop=log.scrollHeight;
  return d;
}

async function ask(text){
  text=(text||"").trim();
  if(!text||busy)return;
  busy=true;add("you",text);
  const w=add("bot","");w.classList.add("typing");w.innerHTML="<i></i><i></i><i></i>";
  try{
    const r=await fetch("/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({text})});
    const d=await r.json();
    const reply=d.reply||"No answer came back. Try rephrasing your question.";
    w.classList.remove("typing");w.textContent=reply;
    if(speak&&"speechSynthesis" in window){speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance(reply))}
  }catch(e){
    w.classList.remove("typing");w.classList.add("err");
    w.textContent="Couldn't reach Callwise. Check your connection and try again.";
  }
  busy=false;log.scrollTop=log.scrollHeight;
}

function send(){const v=txt.value;txt.value="";ask(v)}
document.getElementById("send").onclick=send;
txt.addEventListener("keydown",e=>{if(e.key==="Enter")send()});

spk.onclick=()=>{
  speak=!speak;
  spk.setAttribute("aria-pressed",speak);
  spk.textContent="Voice replies: "+(speak?"on":"off");
  if(!speak&&"speechSynthesis" in window)speechSynthesis.cancel();
};

const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
mic.onclick=()=>{
  if(!SR){add("bot","Voice isn't supported in this browser. Type your question instead.");return}
  if(rec){rec.stop();return}
  rec=new SR();rec.lang="en-IN";
  rec.onstart=()=>{mic.classList.add("live");mic.setAttribute("aria-label","Stop listening")};
  rec.onresult=e=>ask(e.results[0][0].transcript);
  rec.onerror=()=>add("bot","Couldn't hear you. Try again or type your question.");
  rec.onend=()=>{mic.classList.remove("live");mic.setAttribute("aria-label","Tap to speak");rec=null};
  if("speechSynthesis" in window)speechSynthesis.cancel();
  rec.start();
};
</script>
</body>
</html>
